<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苗栗 | 兩天一夜 | 露營</title>
<meta name="description" content="苗栗兩天一夜露營">
<style>
:root {
  --bg:#F3EBDD; /*網頁背景色*/
  --paper:#fffdf8; /*圓點內圓*/
  --ink:#332C27; /*日期.地點文字顏色*/
  --muted:#718078; /*主要停留點文字顏色_不更動*/
  --line:#dfe6df; /*時間線顏色_暫不動*/
  --accent:#3F5944; /*日期按鈕及地圖按鈕*/
  --accent-dark:#71806A; /*日期按鈕文字.時間顏色.景點介紹文字顏色*/
  --gold:#c99a55; /*不明*/
  --shadow:0 14px 40px rgba(57,72,62,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); background:
    radial-gradient(circle at 10% 0%, rgba(201,154,85,.13), transparent 24%),
    radial-gradient(circle at 100% 20%, rgba(108,128,111,.13), transparent 30%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
a{color:inherit}
.page{max-width:1080px;margin:0 auto;padding:22px 16px 48px}
.hero{
  position:relative; overflow:hidden; border-radius:30px; padding:34px;
  background:linear-gradient(135deg,#62776a 0%,#7f9184 58%,#b79b70 100%);
  color:white; box-shadow:var(--shadow);
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.20}
.hero:before{width:260px;height:260px;background:#f8ead1;right:-80px;top:-100px}
.hero:after{width:180px;height:180px;background:#e7f0e7;left:-70px;bottom:-110px}
.eyebrow{position:relative;z-index:1;letter-spacing:.16em;font-size:12px;opacity:.82}
h1{position:relative;z-index:1;margin:10px 0 6px;font-size:clamp(30px,6vw,52px);line-height:1.08;letter-spacing:.02em}
.subtitle{position:relative;z-index:1;margin:0;opacity:.9;font-size:15px}
.hero-row{position:relative;z-index:1;margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:9px 13px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(255,255,255,.10);font-size:13px}
.day-tabs{display:flex;gap:10px;margin:18px 0 16px;position:sticky;top:10px;z-index:20}
.day-tab{flex:1;border:1px solid #d3ddd4;background:rgba(255,253,248,.9);backdrop-filter:blur(10px);padding:12px 14px;border-radius:16px;cursor:pointer;font-weight:800;color:var(--accent-dark);box-shadow:0 6px 18px rgba(57,72,62,.05)}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-panel{display:none}
.day-panel.active{display:block}
.day-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:22px 4px 14px}
.day-heading h2{margin:0;font-size:25px}
.day-heading p{margin:0;color:var(--muted);font-size:13px}
/*DRESS CODE區域*/
.dress-code{margin:0 4px 20px;padding:16px 18px;background:rgba(255,253,248,.92);border:1px solid #e3e8e3;border-radius:20px;box-shadow:0 8px 28px rgba(57,72,62,.07);}
.dress-code-title{margin:0 0 8px;font-size:12px;letter-spacing:.16em;font-weight:900;color:var(--accent-dark);}
.dress-code-content{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.dress-code-color{font-size:17px;font-weight:900;}
.dress-code-description{Color:#68736b;font-size:13px;}
.timeline{position:relative}
.timeline:before{content:"";position:absolute;left:47px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--line),#cbd7cc,var(--line))}
.item{position:relative;display:grid;grid-template-columns:115px 1fr;gap:18px;margin:14px 0}
.time{padding-top:17px;text-align:right;font-weight:900;font-size:15px;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.dot{position:absolute;left:39px;top:20px;width:17px;height:17px;border-radius:50%;background:var(--paper);border:4px solid var(--accent);z-index:2}
.card{background:rgba(255,253,248,.92);border:1px solid #e3e8e3;border-radius:22px;padding:18px;box-shadow:0 8px 28px rgba(57,72,62,.07)}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.place{margin:0;font-size:19px;line-height:1.35}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#eef3ee;color:#5b6d60;font-size:12px;font-weight:700}
.reservation-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:999px;
  background:#fbe4e4;
  color:#c43d3d;
  font-size:12px;
  font-weight:700;
}
.address{margin:12px 0 0;color:#66726d;font-size:13px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:800;border:1px solid #d8e1d9;background:#fff;color:var(--accent-dark);transition:.18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(57,72,62,.08)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.travel{ /*車程時間區塊調整*/
  display:grid;grid-template-columns:115px 1fr;gap:18px;margin:4px 0 6px} /*78pt-68pt-88pt-95pt-110pt-115pt*/
.travel .time{padding-top:8px;color:#8a938d;font-weight:800}
.travel-card{  /*車程時間區塊調整*/
  padding:10px 14px;
  border-radius:14px;
  background:#edf1ed;
  color:#68736b;
  font-size:13px;
  border:1px dashed #cfd9d1;
  width:100%;
}
.footer-note{margin-top:20px;padding:15px 16px;background:rgba(255,253,248,.78);border:1px solid #e3e8e3;border-radius:16px;color:#6b756f;font-size:12px;line-height:1.7}
.topbar{display:flex;justify-content:flex-end;margin:10px 0}
.print-btn{border:0;background:transparent;color:#6a766e;font-size:12px;cursor:pointer}
@media(max-width:680px){ /*手機調整*/
  .dress-code{margin:0 2px 18px;padding:14px 15px;border-radius:18px;} /*dress-code*/
  .dress-code-color{font-size:16px;} /*dress-code*/
  .page{padding:12px 10px 32px}
  .hero{padding:25px 22px;border-radius:24px}
  .timeline:before{left:15px} /*時間線距離 34pt-20pt-15pt*/
  .item,.travel{grid-template-columns:75px 1fr;gap:14px} /*時間距離 58pt-62pt-64pt-68pt-75pt*/
  .dot{left:7px} /*時間點距離 27pt-15pt-10pt-8pt-6pt-7pt*/
  .travel .dot{left:7px} /*時間點距離 29pt-10pt-8pt-6pt-7pt*/
  .time{font-size:13px}
  .card{padding:15px;border-radius:18px}
  .place{font-size:17px}
}
@media print{ /*手機調整*/
  body{background:#fff}
  .page{max-width:none;padding:0}
  .hero{box-shadow:none}
  .day-tabs,.topbar{display:none}
  .day-panel{display:block !important}
  .day-panel + .day-panel{page-break-before:always}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="eyebrow">MINI TRIP · MIAOLI</div>
    <h1>苗栗兩天一夜露營</h1>
    <p class="subtitle">12/19(六) - 12/20(日)｜兩天一夜・自駕行程</p>
    <div class="hero-row">
      <div class="chip">🚗 自駕</div>
      <div class="chip">🌲 苗栗・銅鑼・公館・三義</div>
      <div class="chip">📍 點擊景點即可開地圖</div>
    </div>
  </section>

  <div class="topbar"><button class="print-btn" onclick="window.print()">列印／另存 PDF</button></div>

  <div class="day-tabs" id="tabs"></div>
  <main id="panels"></main>

  <div class="footer-note">
    地圖與景點介紹按鈕會直接開啟原始連結。</br>
    時間皆為預計時間，實際時間依當天實際交通為主。
  </div>
</div>

<script>
const tripData = 
[{"title": "12/19 (六)", 
  "dressCode": {
      "title": "DRESS CODE",
      "color": "❤️🧡💛💚待討論決定💙💜🖤🤍",
      "description": " "
    },
   "items":
   [
     {"type": "spot", "time": "10:00",
         "place": "赫里翁", "round": "出發",
         "address": "臺中市西屯區環中路二段1577號", 
         "maps": "https://maps.app.goo.gl/ej8NsKrKx2Sm7Py79",
         "intro": ""
     }, 
     {"type": "travel", "drive": "40分"
     },
     {"type": "spot", "time": "xx:xx", 
         "place": "我家草莓園", "stay": "?H",
         "address": "苗栗縣大湖鄉富興村7鄰號1-1號",
         "maps": "https://maps.app.goo.gl/DuuyDVfZRZVxrXJh6",
         "intro": "https://www.threads.com/share/LlBnWTTui/", 
         "drive_before": ""
     },
     {"type": "travel", "drive": "5分"
     }, 
     {"type": "spot", "time": "xx:xx", 
         "place": "七里香甕仔雞-大湖店", "stay": "2H",
         "address": "苗栗縣大湖鄉富興村33-66號",
         "maps": "https://maps.app.goo.gl/5L6NtNw2MfP2cRZK7",
         "intro": "https://www.popdaily.com.tw/forum/food/1585780", 
         "drive_before": ""
     },
     {"type": "travel", "drive": "15分"
     }, 
     {"type": "spot", "time": "xx:xx", 
         "place": "公館中義村落羽松秘境", "stay": "1.5-2H", 
         "address": "苗栗縣公館鄉中義村44號之1號", 
         "maps": "https://maps.app.goo.gl/PiC1WTXU9o86hrQ49", 
         "intro": "https://golovetraveling.com/siswater-bald-cypress/", 
         "drive_before": ""
     },
     {"type": "travel", "drive": "5分"
     },
     {"type": "spot", "time": "xx:xx",
          "place": "全聯公館大同店", "stay": "40分",
          "address": "苗栗縣公館鄉館中村大同路201號",
          "maps": "https://maps.app.goo.gl/V8kFeYJ9Us1rqte26", 
         "intro": "", "drive_before": ""
     }, 
     {"type": "travel", "drive": "5分"
     },
     {"type": "spot", "time": "15:00", 
         "place": "六沐森民宿",
         "stay": "-", "address": "苗栗縣公館鄉仁安村仁安99之21號",
         "maps": "https://maps.app.goo.gl/1cXMPKKpyzNydr1J7", 
         "intro": "", 
         "drive_before": ""}]
     },
     {"title": "12/20 (日)",
      "dressCode": {
      "title": "DRESS CODE",
      "color": "❤️🧡💛💚待討論決定💙💜🖤🤍",
      "description": " "
    },
       "items": [
     {"type": "spot", "time": "",
         "place": "六沐森民宿","round": "出發",
         "address": "苗栗縣公館鄉仁安村仁安99之21號", 
         "maps": "https://maps.app.goo.gl/1cXMPKKpyzNydr1J7",
         "intro": "",
     },
     {"type": "travel", "drive": "30分"
     }, 
     {"type": "spot", "time": "10:30", 
         "place": "卓也小屋渡假園區", "stay": "2H",
         "address": "苗栗縣三義鄉雙潭村1-9號", 
         "maps": "https://maps.app.goo.gl/C4CZgJy5Mfc4YDZ96",
         "intro": "https://bunnyann.tw/bunnyann276/",
         "activity_url": "https://joye.myboostime.app/activities/sanyi", "reservation": "已預約11:00體驗", "drive_before": ""
     },
     {"type": "travel", "drive": "30分"
     }, 
     {"type": "spot", "time": "12:40", 
         "place": "勝興老街", "stay": "3H", 
         "address": "苗栗縣三義鄉勝興村", 
         "maps": "https://maps.app.goo.gl/sWo3vPd7rpuueX84A", 
         "intro": "https://bobbytravel.tw/shengxing-station/", "drive_before": ""
     }, 
     {"type": "travel",  "drive": "35分"
     }, 
     {"type": "spot", "time": "16:05", 
         "place": "赫里翁",  
         "address": "臺中市西屯區環中路二段1577號", 
         "maps": "https://maps.app.goo.gl/ej8NsKrKx2Sm7Py79", 
         "intro": "", "drive_before": ""}]
      }];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

function itemIcon(place) {
  const p = place || "";
  if (p.includes("餐")) return "🍴";
  if (p.includes("民宿") || p.includes("小屋")) return "🏡";
  if (p.includes("老街")) return "🏮";
  if (p.includes("全聯")) return "🛒";
  if (p.includes("落羽松") || p.includes("秘境")) return "🌲";
  return "📍";
}

const tabs = document.getElementById("tabs");
const panels = document.getElementById("panels");

tripData.forEach((day, idx) => {
  const tab = document.createElement("button");
  tab.className = "day-tab" + (idx === 0 ? " active" : "");
  tab.textContent = day.title;
  tab.addEventListener("click", () => {
    document.querySelectorAll(".day-tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".day-panel").forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(`panel-${idx}`).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  tabs.appendChild(tab);

  const panel = document.createElement("section");
  panel.className = "day-panel" + (idx === 0 ? " active" : "");
  panel.id = `panel-${idx}`;
  panel.innerHTML = `
   <div class="day-heading">
    <div><h2>${esc(day.title)}</h2></div>
    <p>${day.items.filter(x => x.type === "spot").length} 個主要停留點</p>
  </div>

  <div class="dress-code">
    <div class="dress-code-title">DRESS CODE</div>
    <div class="dress-code-content">
      <div class="dress-code-color">${esc(day.dressCode?.color || "")}</div>
      <div class="dress-code-description">${esc(day.dressCode?.description || "")}</div>
    </div>
  </div>
  <div class="timeline">
      ${day.items.map((it) => {
        if (it.type === "travel") {
          return `
            <div class="travel">
              <div class="dot"></div>
              <div class="time">${esc(it.time)}</div>
              <div class="travel-card">🚗 車程約 ${esc(it.drive)}</div>
            </div>`;
        }
        return `
          <article class="item">
            <div class="dot"></div>
            <div class="time">${esc(it.time || "—")}</div>
            <div class="card">
              <div class="card-head">
                <div>
                  <h3 class="place">${itemIcon(it.place)} ${esc(it.place)}</h3>
                  <div class="meta">
                    ${it.stay ? `<span class="badge">⏱ 預計停留 ${esc(it.stay)}</span>` : ""}
                    ${it.reservation ? `<span class="reservation-badge">${esc(it.reservation)}</span>` : ""}
                    
                <div class="meta">
                    ${it.round ? `<span class="badge">集合 ${esc(it.round)}</span>` : ""}
                </div>
              </div>
              ${it.address ? `<div class="address">📍 ${esc(it.address)}</div>` : ""}
              <div class="actions">
                ${it.maps ? `<a class="btn primary" href="${esc(it.maps)}" target="_blank" rel="noopener">🗺 開啟 Google Maps</a>` : ""}
                ${it.intro ? `<a class="btn" href="${esc(it.intro)}" target="_blank" rel="noopener">🔎 景點介紹</a>` : ""}
                ${it.activity_url ? `<a class="btn" href="${esc(it.activity_url)}" target="_blank" rel="noopener">🎟 體驗項目價目表</a>` : ""}
              </div>
            </div>
          </article>`;
      }).join("")}
    </div>`;
  panels.appendChild(panel);
});
</script>
</body>
</html>
